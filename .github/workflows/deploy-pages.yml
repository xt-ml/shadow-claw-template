# Content-Only ShadowClaw Deployment Template
#
# Required repo structure:
#
#   .github/workflows/deploy-pages.yml   ← this file
#   pages/
#     main/                              ← your markdown / HTML pages (optional)
#     routes.json                        ← optional pretty-path config
#   site-config.json                     ← optional declarative site configuration
#
# Required GitHub repo settings:
#   Settings → Pages → Source: GitHub Actions
#
# Version Pinning:
#   You can pin ShadowClaw to a specific release tag (e.g. "v1.20.0"),
#   commit SHA (e.g. "62253c53"), or branch ("main") via:
#   1. `shadowClawVersion` in `site-config.json`
#   2. `.shadowclaw-version` file in repository root
#   3. `SHADOWCLAW_REF` environment variable in this workflow
#   4. `shadowclaw_ref` input when manually running via Actions UI (workflow_dispatch)
#
# Required secrets / variables:
#   None — GITHUB_TOKEN is granted pages:write automatically by the
#   `permissions` block below.
#
# Customisation:
#   PAGES_ORIGIN and PAGES_BASE_PATH are derived automatically from the
#   repository name, so forks "just work" under
#   https://<owner>.github.io/<repo>/.
#   Override them explicitly if you use a custom domain (set PAGES_BASE_PATH
#   to / for an apex domain).

name: Build and Deploy via ShadowClaw

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      shadowclaw_ref:
        description: "ShadowClaw version tag (e.g. v1.20.0), commit SHA, or branch"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content repo
        uses: actions/checkout@v6
        with:
          path: content

      - name: Resolve ShadowClaw version / ref
        id: resolve-ref
        shell: bash
        run: |
          REF="${{ github.event.inputs.shadowclaw_ref }}"
          if [ -z "$REF" ]; then
            REF=$(node -e '
              try {
                const fs = require("fs");
                const configPath = "content/site-config.json";
                if (fs.existsSync(configPath)) {
                  const cfg = JSON.parse(fs.readFileSync(configPath, "utf8"));
                  const v = cfg.shadowClawVersion || cfg.shadowClawRef || cfg.shadowclawVersion || cfg.shadowclawRef || "";
                  process.stdout.write(String(v).trim());
                }
              } catch (e) {
                process.stdout.write("");
              }
            ')
          fi
          if [ -z "$REF" ] && [ -f "content/.shadowclaw-version" ]; then
            REF=$(tr -d ' \n\r\t' < content/.shadowclaw-version)
          fi
          if [ -z "$REF" ]; then
            REF="${SHADOWCLAW_REF:-main}"
          fi
          echo "Resolved ShadowClaw ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout ShadowClaw core (build toolchain)
        uses: actions/checkout@v6
        with:
          repository: xt-ml/shadow-claw
          path: shadow-claw
          ref: ${{ steps.resolve-ref.outputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: shadow-claw/package-lock.json

      - name: Install ShadowClaw build dependencies
        run: npm ci
        working-directory: shadow-claw

      - name: Inject content into ShadowClaw build root
        run: |
          rm -rf shadow-claw/pages
          if [ -d "content/pages" ]; then cp -r content/pages shadow-claw/; fi
          if [ -d "content/.agents" ]; then cp -r content/.agents shadow-claw/; fi
          if [ -f "content/site-config.json" ]; then cp content/site-config.json shadow-claw/; fi
          if [ -d "content/assets" ]; then cp -r content/assets shadow-claw/; fi
          mkdir -p shadow-claw/pages
          if [ -f "content/404.html" ]; then cp content/404.html shadow-claw/pages/; fi
          if [ -f "content/manifest.json" ]; then cp content/manifest.json shadow-claw/pages/; fi
          if [ -f "content/sitemap.xml" ]; then cp content/sitemap.xml shadow-claw/pages/; fi

      - name: Build production bundle
        working-directory: shadow-claw
        env:
          NODE_ENV: production
          PAGES_ORIGIN: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          PAGES_BASE_PATH: "/${{ github.event.repository.name }}/"
        run: npm run build:prod

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: shadow-claw/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
